# OpenLiteSpeed vhost for obiyoshots.com (CyberPanel).
#
# Replaces the stock PHP vhost. The original served $VH_ROOT/public_html as a
# static docroot looking for index.php/index.html; a Next.js app has neither,
# which is why every URL returned 404. Here `context /` hands every request to
# the Next.js server on 127.0.0.1:4300 instead.
#
# Install as root:
#   cp deploy/litespeed-vhost.conf /usr/local/lsws/conf/vhosts/obiyoshots.com/vhost.conf
#   /usr/local/lsws/bin/lswsctrl restart
#
# The Node process itself is started by systemd, not by this file — see
# deploy/obiyo-cyberpanel.service.

docRoot                   $VH_ROOT/public_html
vhDomain                  $VH_NAME
vhAliases                 www.$VH_NAME
adminEmails               fyawodoom@gmail.com
enableGzip                1
enableIpGeo               1

# No `index` block: with every request proxied, LiteSpeed never looks for an
# index file, so indexFiles would be dead configuration.

errorlog $VH_ROOT/logs/$VH_NAME.error_log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

accesslog $VH_ROOT/logs/$VH_NAME.access_log {
  useServer               0
  logFormat               "%h %l %u %t "%r" %>s %b "%{Referer}i" "%{User-Agent}i""
  logHeaders              5
  rollingSize             10M
  keepDays                10
  compressArchive         1
}

# The PHP scripthandler, the lsphp extprocessor and phpIniOverride are gone on
# purpose. Nothing in this project is PHP, and the docRoot is the git working
# tree — leaving a PHP handler wired up means any .php file that ever lands in
# there executes as the site user.

module cache {
  storagePath /usr/local/lsws/cachedata/$VH_NAME
}

rewrite  {
  enable                  1
  autoLoadHtaccess        1
}

# The Next.js server. respBuffer 0 matters: Next streams RSC payloads, and
# buffering them would hold the whole response until it completed.
extprocessor nextjs {
  type                    proxy
  address                 http://127.0.0.1:4300
  maxConns                100
  initTimeout             60
  retryTimeout            0
  persistConn             1
  pcKeepAliveTimeout      60
  respBuffer              0
}

# ACME must stay on the filesystem and must be declared BEFORE `context /`,
# or renewal requests get proxied into the app and certificate renewal fails.
context /.well-known/acme-challenge {
  location                /usr/local/lsws/Example/html/.well-known/acme-challenge
  allowBrowse             1

  rewrite  {
    enable                0
  }
  addDefaultCharset       off
}

# Everything else goes to Node. Next serves its own static assets under
# /_next/static, so there is no second static context to keep in sync — and
# because no request reaches the filesystem, the repo living in the docroot
# (.git, src/, package.json) stops being publicly readable.
context / {
  type                    proxy
  handler                 nextjs
  addDefaultCharset       off
}

vhssl  {
  keyFile                 /etc/letsencrypt/live/obiyoshots.com/privkey.pem
  certFile                /etc/letsencrypt/live/obiyoshots.com/fullchain.pem
  certChain               1
  sslProtocol             24
  enableECDHE             1
  renegProtection         1
  sslSessionCache         1
  enableSpdy              15
  enableStapling          1
  ocspRespMaxAge          86400
}
