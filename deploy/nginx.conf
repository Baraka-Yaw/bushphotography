# Install to /etc/nginx/sites-available/obiyo, then:
#
#   sudo ln -s /etc/nginx/sites-available/obiyo /etc/nginx/sites-enabled/obiyo
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is terminated upstream (Cloudflare / existing proxy), so this listens on
# :80 and trusts the forwarded protocol. If you ever move TLS onto this box,
# add a 443 server block with your cert and redirect :80 to it.

upstream obiyo_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # >>> CHANGE THIS to your domain <<<
    server_name example.com www.example.com;

    # The site is photography-heavy; a JPEG is already compressed, so this is
    # only worth it for the HTML/JS/CSS.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/rss+xml;
    gzip_min_length 1024;

    # Cover-image uploads and the contact form are both small; this mostly caps
    # abuse. Server Actions have their own 1MB body limit inside Next.
    client_max_body_size 4m;

    location / {
        proxy_pass http://obiyo_app;
        proxy_http_version 1.1;

        # Host must survive the hop intact. Next compares the Origin header of a
        # Server Action request against the host, and rejects the request as a
        # CSRF attempt if they disagree — that is how the contact form breaks
        # behind a misconfigured proxy.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        # Upstream terminates TLS, so the scheme has to be asserted here or Next
        # sees plain http and the origin check fails on an https site.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Off, so React streaming reaches the browser progressively instead of
        # nginx holding the whole response until render completes.
        proxy_buffering off;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Hashed build output is immutable — serve it from nginx and never revalidate.
    location /_next/static/ {
        proxy_pass http://obiyo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Optimized images. Next handles its own cache headers; this just keeps the
    # noise out of the access log.
    location /_next/image {
        proxy_pass http://obiyo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /favicon.ico { proxy_pass http://obiyo_app; access_log off; }
    location = /robots.txt  { proxy_pass http://obiyo_app; access_log off; }

    access_log /var/log/nginx/obiyo.access.log;
    error_log  /var/log/nginx/obiyo.error.log;
}
